<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundTwin</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #171920; --panel2: #1f222b; --line: #2b2f3a;
    --text: #eceef3; --muted: #8e94a3; --accent: #7cf0c1; --accent-ink: #06281c;
    --warn: #ffc46b; --bad: #ff8c8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 6px 0 28px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  #drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 30px 16px; text-align: center;
    cursor: pointer; color: var(--muted); transition: .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); color: var(--text); background: var(--panel2); }
  #drop b { color: var(--text); }
  .or { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0; letter-spacing: 1px; }
  .row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button.go {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
    padding: 0 20px; font: 600 15px inherit; cursor: pointer; white-space: nowrap;
  }
  button.go:disabled { opacity: .45; cursor: default; }
  #steps { margin: 18px 0 0; padding: 0; list-style: none; color: var(--muted); }
  #steps li { padding: 3px 0; }
  #steps li::before { content: "✓ "; color: var(--accent); }
  #steps li.now { color: var(--text); }
  #steps li.now::before { content: "… "; color: var(--warn); }
  .err { color: var(--bad); margin-top: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 32px 0 10px; }
  .match { display: flex; gap: 16px; align-items: center; }
  .match img { width: 120px; height: 120px; border-radius: 10px; object-fit: cover; background: var(--panel2); flex: none; }
  .match .t { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .match .a { color: var(--muted); margin-top: 2px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; margin: 8px 6px 0 0; }
  .ok { background: rgba(124,240,193,.14); color: var(--accent); }
  .wn { background: rgba(255,196,107,.14); color: var(--warn); }
  .links a { color: var(--accent); margin-right: 14px; font-size: 13px; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  audio { width: 100%; height: 34px; margin-top: 10px; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .item {
    display: grid; grid-template-columns: 52px 1fr 130px 36px; gap: 12px; align-items: center;
    padding: 9px 4px; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: 0; }
  .item img { width: 52px; height: 52px; border-radius: 6px; background: var(--panel2); }
  .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item a { color: inherit; text-decoration: none; }
  .item a:hover { text-decoration: underline; }
  .stems { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 7px; }
  .stem .sl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; gap: 4px; white-space: nowrap; }
  .stem .bar { height: 4px; }
  .stem .bar i { background: #8fb4ff; }
  @media (max-width: 560px) { .stems { grid-template-columns: repeat(2, 1fr); } }
  .bar { height: 6px; background: var(--panel2); border-radius: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .pct { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .play {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2);
    color: var(--text); cursor: pointer; font-size: 13px;
  }
  .play:hover { border-color: var(--accent); }
  .play.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  @media (max-width: 560px) {
    .match { flex-direction: column; align-items: flex-start; }
    .item { grid-template-columns: 44px 1fr 36px; }
    .item .score { grid-column: 2 / 4; grid-row: 2; }
    .item img { width: 44px; height: 44px; }
    .row { flex-direction: column; } button.go { padding: 11px; }
  }
</style>
</head>
<body>
<main>
  <h1>Sound<span>Twin</span></h1>
  <p class="sub">Drop in a clip or a link. Get the original recording — not a cover — and songs that sound like it.</p>

  <div class="panel">
    <div id="drop"><b>Drop an .mp3 or .mp4 here</b><br>or click to choose a file</div>
    <input type="file" id="file" accept="audio/*,video/*,.mp3,.mp4,.m4a,.wav,.mov,.webm" hidden>
    <div class="or">OR</div>
    <div class="row">
      <input type="text" id="url" placeholder="Paste a YouTube or TikTok link" autocomplete="off">
      <button class="go" id="go">Find it</button>
    </div>
    <ul id="steps"></ul>
    <div class="err" id="err"></div>
  </div>

  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileIn = $('file'), urlIn = $('url'), go = $('go');
let file = null, player = null, playingBtn = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '';

function setFile(f) {
  file = f;
  drop.innerHTML = f ? `<b>${esc(f.name)}</b><br>ready — press Find it` : '<b>Drop an .mp3 or .mp4 here</b><br>or click to choose a file';
  if (f) urlIn.value = '';
}
drop.onclick = () => fileIn.click();
fileIn.onchange = () => setFile(fileIn.files[0] || null);
['dragover', 'dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => { if (ev.dataTransfer.files[0]) setFile(ev.dataTransfer.files[0]); });
urlIn.oninput = () => { if (urlIn.value && file) setFile(null); };
urlIn.onkeydown = e => { if (e.key === 'Enter') go.click(); };

go.onclick = async () => {
  $('err').textContent = ''; $('out').innerHTML = ''; $('steps').innerHTML = '';
  const fd = new FormData();
  if (file) fd.append('file', file); else fd.append('url', urlIn.value.trim());
  go.disabled = true;
  try {
    const r = await fetch('/api/analyze', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Could not start');
    await poll(j.id);
  } catch (e) { $('err').textContent = e.message; }
  go.disabled = false;
};

async function poll(id) {
  for (;;) {
    const j = await (await fetch('/api/job/' + id)).json();
    $('steps').innerHTML = j.steps.map((s, i) =>
      `<li class="${!j.done && i === j.steps.length - 1 ? 'now' : ''}">${esc(s)}</li>`).join('');
    if (j.done) {
      if (j.error) throw new Error(j.error);
      return render(j.result);
    }
    await new Promise(r => setTimeout(r, 700));
  }
}

function render(r) {
  const out = $('out');
  if (!r.match) {
    out.innerHTML = `<h2>Result</h2><div class="panel">No match found. The clip may be too noisy, have talking over the music, or the song isn't in the catalog. Try a part of the video where the music is clearest.</div>`;
    return;
  }
  const m = r.match, o = r.original;
  const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
  let badges = '';
  if (m.cover) badges += `<span class="badge wn">Cover / altered version (“${esc(m.cover)}”)</span>`;
  else badges += `<span class="badge ok">Original recording</span>`;
  if (r.speed !== 1) badges += `<span class="badge wn">Your clip is ${r.speed > 1 ? 'sped up' : 'slowed'} ×${r.speed}</span>`;
  const meta = [m.album, m.year, m.genre, r.bpm ? `~${r.bpm} BPM` : ''].filter(Boolean).map(esc).join(' · ');

  let html = `<h2>${m.cover ? 'What your clip contains' : 'Exact match'}</h2>
  <div class="panel"><div class="match">
    ${safeUrl(m.art) ? `<img src="${safeUrl(m.art)}" alt="">` : ''}
    <div style="min-width:0;flex:1">
      <div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist)}</div>
      <div class="meta">${meta}</div>${badges}
      <div class="links" style="margin-top:10px">
        ${safeUrl(m.shazam) ? `<a href="${safeUrl(m.shazam)}" target="_blank" rel="noopener">Shazam</a>` : ''}
        ${safeUrl(m.deezer) ? `<a href="${safeUrl(m.deezer)}" target="_blank" rel="noopener">Deezer</a>` : ''}
        <a href="${esc(yt(m.artist + ' ' + m.title))}" target="_blank" rel="noopener">YouTube</a>
      </div>
      ${safeUrl(m.preview) ? `<audio controls preload="none" src="${safeUrl(m.preview)}"></audio>` : ''}
    </div></div></div>`;

  if (m.cover) {
    html += `<h2>The original</h2><div class="panel">`;
    html += o ? `<div class="match">
      ${safeUrl(o.art) ? `<img src="${safeUrl(o.art)}" alt="">` : ''}
      <div style="min-width:0;flex:1">
        <div class="t">${esc(o.title)}</div><div class="a">${esc(o.artist)}</div>
        <div class="meta">${esc(o.album || '')}</div><span class="badge ok">Most likely original</span>
        <div class="links" style="margin-top:10px">
          ${safeUrl(o.link) ? `<a href="${safeUrl(o.link)}" target="_blank" rel="noopener">Deezer</a>` : ''}
          <a href="${esc(yt(o.artist + ' ' + o.title))}" target="_blank" rel="noopener">YouTube</a>
        </div>
        ${safeUrl(o.preview) ? `<audio controls preload="none" src="${safeUrl(o.preview)}"></audio>` : ''}
      </div></div>` : `Couldn't pin down the original automatically.`;
    html += `</div>`;
  }

  const sim = r.similar || [];
  const parts = [['drums', 'Drums'], ['bass', 'Bass'], ['other', 'Guitars & keys'], ['vocals', 'Vocals']];
  const stemRow = s => !s.stems ? '' : `<div class="stems">${parts.map(([k, label]) => {
    const v = s.stems[k];
    return `<div class="stem"><div class="sl"><span>${label}</span><span>${v == null ? 'none' : v + '%'}</span></div>
      <div class="bar"><i style="width:${v ?? 0}%"></i></div></div>`;
  }).join('')}</div>`;
  html += `<h2>${r.stems ? 'Top 10 played most like it' : 'Sounds like it'}</h2>`;
  if (!sim.length) html += `<div class="panel">No similar songs found for this one.</div>`;
  else {
    html += `<p class="note">${r.stems
      ? 'Your clip and each song were split into drums, bass, guitars &amp; keys and vocals, then compared part by part: tone, rhythm pattern, note density and grit.'
      : 'Different songs, ranked by how close they sound to your clip (tone, harmony and tempo).'}${
      r.hidden_covers ? ` ${r.hidden_covers} cover/altered version${r.hidden_covers > 1 ? 's' : ''} hidden.` : ''}</p><div class="panel">`;
    html += sim.map(s => `<div class="item">
      ${safeUrl(s.art) ? `<img src="${safeUrl(s.art)}" alt="" loading="lazy">` : '<span></span>'}
      <div style="min-width:0"><div class="t"><a href="${safeUrl(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a></div>
        <div class="a">${esc(s.artist)}</div>${stemRow(s)}</div>
      <div class="score">${s.score == null ? '<div class="pct"><span>no preview</span></div>' :
        `<div class="pct"><span>${s.score}% match</span><span>${s.bpm} BPM</span></div><div class="bar"><i style="width:${s.score}%"></i></div>`}</div>
      ${safeUrl(s.preview) ? `<button class="play" data-src="${safeUrl(s.preview)}" title="Play preview">▶</button>` : '<span></span>'}
    </div>`).join('') + `</div>`;
  }
  out.innerHTML = html;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.play');
  if (!b) return;
  if (player) { player.pause(); if (playingBtn) { playingBtn.classList.remove('on'); playingBtn.textContent = '▶'; } }
  if (playingBtn === b) { playingBtn = null; return; }
  player = new Audio(b.dataset.src);
  player.play();
  playingBtn = b; b.classList.add('on'); b.textContent = '■';
  player.onended = () => { b.classList.remove('on'); b.textContent = '▶'; playingBtn = null; };
});
</script>
</body>
</html>
